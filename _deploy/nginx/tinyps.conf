# ====== 裸域名 tinyps.top ======
# 证书本身对 tinyps.top / www.tinyps.top 都有效，但站点唯一主域名是 www
# （落地页 canonical 与 og:url 均为 https://www.tinyps.top/），
# 故裸域名统一 301 到 www，避免同一站点两个主域名导致的安全提示与 SEO 重复内容。
# ====== Cloudflare 回源适配 ======
# 开启代理后，请求的 TCP 来源是 Cloudflare 边缘节点，
# 需还原真实客户端 IP，否则访问日志全是 CF 节点 IP、
# 且无法按来源做统计或限流。
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;
real_ip_recursive on;

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name tinyps.top;

    ssl_certificate     /dockerdata/crt/tinyps/cert.pem;
    ssl_certificate_key /dockerdata/crt/tinyps/cert.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSLAPEX:1m;
    ssl_session_timeout 1d;

    # HSTS：一年内强制 HTTPS，浏览器不再对该域走 HTTP
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    return 301 https://www.tinyps.top$request_uri;
}

# ====== 主域名 www.tinyps.top ======
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.tinyps.top;

    ssl_certificate     /dockerdata/crt/tinyps/cert.pem;
    ssl_certificate_key /dockerdata/crt/tinyps/cert.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /dockerdata/tinyps;
    index index.html index.htm;

    # Cloudflare 回源时透传原始协议，便于源站识别
    # （不影响直连访问；直连时该头为空）
    add_header X-Forwarded-Proto $http_x_forwarded_proto always;


    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 首页不缓存，避免浏览器/代理缓存旧版
    # 注意：子块自带 add_header 会覆盖父块的继承，故 HSTS 需在此重复声明一次
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /dockerdata/tinyps;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }
}
