<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — TinyPS</title>
<meta name="robots" content="noindex, follow">
<meta name="description" content="The page you are looking for does not exist.">
<link rel="icon" href="/assets/logo.png">
<style>
  :root{--bg:#14161a;--bg2:#1d2026;--txt:#e8eaed;--txt3:#9aa0a8;--acc:#4da3ff;--accBg:rgba(77,163,255,.12);--border:#2c313a;--radius:12px}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font:15px/1.75 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--txt);display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px}
  .box{max-width:520px;text-align:center}
  .mark{width:56px;height:56px;border-radius:14px;object-fit:cover;margin-bottom:18px}
  h1{font-size:26px;margin-bottom:10px}
  p{color:var(--txt3);margin-bottom:26px}
  .btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  a.btn{display:inline-block;background:var(--acc);color:#fff;border-radius:8px;padding:11px 24px;font-weight:600;text-decoration:none}
  a.btn.outline{background:transparent;border:1px solid var(--border);color:var(--txt)}
  a.btn:hover{opacity:.9}
  .links{margin-top:26px;font-size:14px;color:var(--txt3)}
  .links a{color:var(--txt3);margin:0 10px;text-decoration:none}
  .links a:hover{color:var(--acc)}
</style>
</head>
<body>
  <div class="box">
    <img class="mark" src="/assets/logo.png" alt="TinyPS logo">
    <h1>404 · Page not found</h1>
    <p>This page doesn't exist (or has moved). Everything still works on the homepage — or try the web editor, no install needed.</p>
    <div class="btns">
      <a class="btn" href="/">Back to homepage</a>
      <a class="btn outline" href="/editor/">Open the online editor</a>
    </div>
    <div class="links">
      <a href="/install.html">Install guide</a>
      <a href="/support.html">Support</a>
      <a href="/privacy.html">Privacy</a>
    </div>
  </div>
</body>
</html>
