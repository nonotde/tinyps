server {
    listen 80;
    server_name pic.zxxdb.com www.pic.zxxdb.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name pic.zxxdb.com www.pic.zxxdb.com;

    ssl_certificate     /etc/nginx/conf/cert/cert.pem;
    ssl_certificate_key /etc/nginx/conf/cert/cert.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /etc/nginx/tinyps;
    index index.html;

    error_page 404 /404.html;
    location = /404.html { internal; }

    # 在线编辑器 ORT 运行时以 ESM 动态 import 加载 .mjs，必须是 JS MIME
    location ~* \.mjs$ { types { text/javascript mjs; } }

    # 许可证校验网关：大陆无法访问 workers.dev，由本机直连 Creem API 中转
    location /v1/licenses/ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods 'POST, OPTIONS' always;
            add_header Access-Control-Allow-Headers 'Content-Type' always;
            return 204;
        }
        proxy_pass https://api.creem.io;
        proxy_ssl_server_name on;
        proxy_set_header Host api.creem.io;
        proxy_set_header X-Api-Key creem_WfBqTR2Pg8hE4OpVWtfeH;
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods 'POST, OPTIONS' always;
        add_header Access-Control-Allow-Headers 'Content-Type' always;
    }

    # 试用计时网关：与 /v1/licenses 同构，代理到 Cloudflare Worker（大陆无法直达 workers.dev）
    location /v1/trial/ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods 'POST, OPTIONS' always;
            add_header Access-Control-Allow-Headers 'Content-Type' always;
            return 204;
        }
        proxy_pass https://api.tinyps.top;
        proxy_ssl_server_name on;
        proxy_set_header Host api.tinyps.top;
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods 'POST, OPTIONS' always;
        add_header Access-Control-Allow-Headers 'Content-Type' always;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|webp|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    access_log /var/log/nginx/pic.access.log;
    error_log  /var/log/nginx/pic.error.log;
}
