# ====== 国内站 pic.zxxdb.com（中文镜像，含 ICP 备案号）======
# 部署位置：国内服务器（musicweb, 117.72.71.14）/etc/nginx/conf.d/pic.zxxdb.conf
# 站点根目录：/dockerdata/cn
# 证书：需用 acme.sh 单独签发 pic.zxxdb.com / www.pic.zxxdb.com（与 tinyps.top 同套流程）
#   acme.sh --issue -d pic.zxxdb.com -d www.pic.zxxdb.com --nginx
#   --install-cert 复制到 /dockerdata/crt/pic.zxxdb/ 并 reload nginx
#
# 若 pic.zxxdb.com 也接入 Cloudflare（推荐：国内访问提速明显，tinyps.top 已验证），
# 请在 Cloudflare 侧开启代理并把下方证书改回 CF 提供的 Origin 证书，
# 同时放开 80/443 仅允许 Cloudflare 网段回源。

# 80 → 443
server {
    listen 80;
    listen [::]:80;
    server_name pic.zxxdb.com www.pic.zxxdb.com;
    return 301 https://$host$request_uri;
}

# www → 裸域名（canonical 统一为 pic.zxxdb.com，与历史 sitemap 一致）
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.pic.zxxdb.com;

    ssl_certificate     /dockerdata/crt/pic.zxxdb/cert.pem;
    ssl_certificate_key /dockerdata/crt/pic.zxxdb/cert.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSLCN:10m;
    ssl_session_timeout 1d;

    return 301 https://pic.zxxdb.com$request_uri;
}

# ====== 主站 pic.zxxdb.com ======
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name pic.zxxdb.com;

    ssl_certificate     /dockerdata/crt/pic.zxxdb/cert.pem;
    ssl_certificate_key /dockerdata/crt/pic.zxxdb/cert.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSLCN:10m;
    ssl_session_timeout 1d;

    root /dockerdata/cn;
    index index.html index.htm;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 首页不缓存，避免浏览器/代理缓存旧版
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # 静态资源长缓存（JS/CSS/图片），部署时带 hash 或靠 ETag
    location ~* \.(js|css|png|jpg|jpeg|gif|webp|svg|woff2?|avif)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 404 /404.html;
    location = /404.html {
        root /dockerdata/cn;
        internal;
    }
}
