# ====== 裸域名 tinyps.top ======
# 证书本身对 tinyps.top / www.tinyps.top 都有效，但站点唯一主域名是 www
# （落地页 canonical 与 og:url 均为 https://www.tinyps.top/），
# 故裸域名统一 301 到 www，避免同一站点两个主域名导致的安全提示与 SEO 重复内容。
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name tinyps.top;

    ssl_certificate     /dockerdata/crt/tinyps/cert.pem;
    ssl_certificate_key /dockerdata/crt/tinyps/cert.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSLAPEX:1m;
    ssl_session_timeout 1d;

    # HSTS：一年内强制 HTTPS，浏览器不再对该域走 HTTP
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    return 301 https://www.tinyps.top$request_uri;
}

# ====== 主域名 www.tinyps.top ======
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.tinyps.top;

    ssl_certificate     /dockerdata/crt/tinyps/cert.pem;
    ssl_certificate_key /dockerdata/crt/tinyps/cert.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /dockerdata/tinyps;
    index index.html index.htm;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 英文安装页已并入 install.html，301 保留旧链接（曾提交过 GSC/Bing）
    location = /install-en.html {
        return 301 /install.html;
    }

    # 首页不缓存，避免浏览器/代理缓存旧版
    # 注意：子块自带 add_header 会覆盖父块的继承，故 HSTS 需在此重复声明一次
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # ====== Pro 许可证校验网关 ======
    # 原为国内站 pic.zxxdb.com 的 /v1/licenses/ 反代（国内无法访问 workers.dev 时兜底）。
    # 国内站下线后，网关迁移到主域名，行为与 CORS 头保持不变。
    location /v1/licenses/ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods 'POST, OPTIONS' always;
            add_header Access-Control-Allow-Headers 'Content-Type' always;
            return 204;
        }
        proxy_pass https://api.creem.io;
        proxy_ssl_server_name on;
        proxy_set_header Host api.creem.io;
        proxy_set_header X-Api-Key creem_WfBqTR2Pg8hE4OpVWtfeH;
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods 'POST, OPTIONS' always;
        add_header Access-Control-Allow-Headers 'Content-Type' always;
    }

    # 真实 404：不再用 /index.html 兜底返回 200，避免软 404 消耗抓取预算
    # 在线编辑器 ORT 运行时以 ESM 动态 import 加载 .mjs —— 必须是 JS MIME（默认 octet-stream 会失败）
    location ~* \.mjs$ { types { text/javascript mjs; } }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        root /dockerdata/tinyps;
        internal;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /dockerdata/tinyps;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }
}
